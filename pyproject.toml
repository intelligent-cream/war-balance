[project]
name = "follow-the-money-ukraine"
version = "0.1.0"
description = "Follow the money: per country, how much flows to Ukraine and to Russia."
requires-python = ">=3.12"
dependencies = ["pycountry>=24.6"]

[dependency-groups]
dev = [
    "pre-commit>=3.7",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]
