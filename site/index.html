<style>
/* Layout: full-screen map as the ground, a control bar on top, the country ledger slides in from the right (bottom sheet on phones). */
:root {
  --sea: #d9e1e7;
  --land: #c5ced5;
  --land-edge: #f4f6f8;
  --surface: #ffffff;
  --ink: #15212b;
  --ink-soft: #55636e;
  --line: #d3dae0;
  --ukr: #2a6fb0;          /* support for Ukraine */
  --ukr-lo: #d6e6f4;
  --rus: #d4601a;          /* flows reaching Russia */
  --rus-lo: #fde2c6;
  --back: #8f7417;
  --target: #39424a;       /* Ukraine and Russia themselves */         /* money flowing back from Ukraine */
  --mid: #c9d0d6;           /* countries close to zero: grey, distinct from the sea */
  --focus: #0d4f66;
  --warn-bg: #f3f5f7;
  --warn-ink: #55636e;
  --rus-text: #b4500f;     /* orange for text and for pressed buttons with white text: 4.5:1 on the surface */
  --on-accent: #fff;       /* text on a pressed blue or orange button */
  --font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sea: #0e161d; --land: #26333d; --land-edge: #0e161d; --surface: #141f28; --ink: #e3e9ee; --ink-soft: #97a6b1;
    --line: #2b3944; --ukr: #6aa8e0; --ukr-lo: #1b3350; --rus: #f39a52; --rus-lo: #4a2a14; --back: #d9bd55; --target: #6b7782; --mid: #4f5962;
    --focus: #8fd3ea; --warn-bg: #141f28; --warn-ink: #c9d2d9; color-scheme: dark;
    --rus-text: #f39a52; --on-accent: #141f28;
  }
}
:root[data-theme="dark"] {
  --sea: #0e161d; --land: #26333d; --land-edge: #0e161d; --surface: #141f28; --ink: #e3e9ee; --ink-soft: #97a6b1;
  --line: #2b3944; --ukr: #6aa8e0; --ukr-lo: #1b3350; --rus: #f39a52; --rus-lo: #4a2a14; --back: #d9bd55; --target: #6b7782; --mid: #4f5962;
  --focus: #8fd3ea; --warn-bg: #141f28; --warn-ink: #c9d2d9; color-scheme: dark;
    --rus-text: #f39a52; --on-accent: #141f28;
}
html, body { height: 100%; }
body { margin: 0; background: var(--sea); color: var(--ink); font-family: var(--font-body); font-size: 15px; overflow: hidden; }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.app { position: relative; height: 100%; display: flex; flex-direction: column; }
.sample { background: var(--warn-bg); color: var(--warn-ink); font-size: 13px; padding-block: 6px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sample b { font-weight: 600; }

.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--surface); border-bottom: 1px solid var(--line); z-index: 5; position: relative; }
.brand { font-family: var(--font-display); font-weight: 800; font-stretch: 115%; font-size: 18px; letter-spacing: -0.01em; margin: 0; white-space: nowrap; }
.brand span { color: var(--ink-soft); font-weight: 500; font-stretch: 100%; font-size: 13px; margin-left: 6px; letter-spacing: 0; }
.controls { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin-left: auto; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 6px 10px; font-size: 13px; cursor: pointer; white-space: nowrap; hyphens: auto; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
/* the light blues and oranges of dark mode take dark text; light mode's orange is darkened for white text (4.5:1 either way) */
.seg button[data-lens="ukr"][aria-pressed="true"] { background: var(--ukr); color: var(--on-accent); }
.seg button[data-lens="rus"][aria-pressed="true"] { background: var(--rus-text); color: var(--on-accent); }
.year { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-soft); }
.year input { width: 110px; accent-color: var(--ink); }
.year output { font-family: var(--font-data); color: var(--ink); min-width: 4ch; white-space: nowrap; }
.search input { width: 160px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--sea); font-size: 13px; }
.lang { display: inline-flex; align-items: center; gap: 4px; font-size: 14px; }
.lang select { padding: 5px 4px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); font-size: 13px; cursor: pointer; }

.stage { position: relative; flex: 1; min-height: 0; overflow: hidden; }   /* clips the closed panel, which waits off to the side */
#map { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
#map:active { cursor: grabbing; }
.country { stroke: var(--land-edge); stroke-width: 0.6; vector-effect: non-scaling-stroke; transition: fill 0.35s ease; cursor: pointer; }
.country.nodata { fill: url(#hatch); }
.country:hover { stroke: var(--ink); stroke-width: 1.2; }
.country.selected { stroke: var(--ink); stroke-width: 2; }
.country.target-ukr, .country.target-rus { fill: var(--target); cursor: default; }
.hatch-bg { fill: var(--land); }
.hatch-line { stroke: var(--ink-soft); stroke-opacity: 0.45; stroke-width: 1.4; }
.target-label { font-family: var(--font-display); font-weight: 700; font-stretch: 112%; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; fill: #f4f6f8; pointer-events: none; paint-order: stroke; stroke: rgba(0,0,0,0.55); stroke-width: 2.5px; }

.tooltip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
  padding: 6px 9px; font-size: 13px; box-shadow: 0 4px 14px rgba(0,0,0,0.12); white-space: nowrap; z-index: 4; }
.tooltip b { display: block; font-weight: 600; }
.tooltip .v { font-family: var(--font-data); }

.legend { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; width: 250px; font-size: 12px; z-index: 2; }
.legend h2 { font-family: var(--font-display); font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; margin: 0 0 8px; }
.legend .ramp { height: 10px; border-radius: 3px; }
.legend .steps { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; height: 14px; }
.legend .steps span { border-radius: 2px; }
.legend .step-labels { position: relative; height: 14px; margin-top: 3px; font-family: var(--font-data); font-size: 11px; color: var(--ink-soft); }
.legend .step-labels span { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; }
.map-title { position: absolute; top: 12px; left: max(16px, env(safe-area-inset-left, 0px)); max-width: min(520px, calc(100% - 32px)); background: var(--surface);
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; z-index: 2; font-size: 13px; line-height: 1.35; box-shadow: 0 4px 14px rgba(0,0,0,0.08); }
.map-title b { font-family: var(--font-display); font-weight: 800; font-size: 15px; display: block; }
.map-title .key2 { color: var(--ink-soft); }
.map-title .dot2 { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; margin: 0 3px 0 6px; }
.fig { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 4px 10px; align-items: start; border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.fig .sw { width: 16px; height: 16px; border-radius: 4px; margin-top: 3px; border: 1px solid var(--line); }
.fig .t { font-size: 12px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.06em; font-family: var(--font-display); font-weight: 700; }
.fig .v { font-family: var(--font-display); font-weight: 800; font-size: 30px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.fig .s { font-size: 12.5px; color: var(--ink-soft); grid-column: 2; }
.legend .ticks { display: flex; justify-content: space-between; margin-top: 4px; font-family: var(--font-data); color: var(--ink-soft); font-size: 11px; }
.legend .keys { display: flex; gap: 12px; margin-top: 8px; color: var(--ink-soft); flex-wrap: wrap; }
.legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 4px; }
.zoom { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 4px; z-index: 2; }
.zoom button { width: 34px; height: 34px; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; cursor: pointer; font-size: 18px; line-height: 1; }

/* Country ledger */
.panel { position: absolute; top: 12px; right: max(12px, env(safe-area-inset-right, 0px)); bottom: 12px; width: 400px; max-width: calc(100% - 24px);
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.12);
  overflow-y: auto; z-index: 3; transform: translateX(0); transition: transform 0.3s ease, opacity 0.3s ease; }
.panel[data-open="false"] { transform: translateX(calc(100% + 24px)); opacity: 0; pointer-events: none; }
.panel-head { position: sticky; top: 0; background: var(--surface); padding: 16px 18px 12px; border-bottom: 1px solid var(--line); display: flex; align-items: start; gap: 12px; z-index: 1; }
.panel-head h2 { font-family: var(--font-display); font-weight: 800; font-stretch: 112%; font-size: 24px; line-height: 1.1; margin: 0; text-wrap: balance; }
.panel-head .meta { font-family: var(--font-data); font-size: 12px; color: var(--ink-soft); margin-top: 4px; }
.close { margin-left: auto; border: 1px solid var(--line); background: transparent; border-radius: 6px; width: 30px; height: 30px; cursor: pointer; font-size: 16px; flex: none; }
.panel-body { padding: 14px 18px 22px; display: grid; gap: 22px; }
.section h3 { font-family: var(--font-display); font-size: 12px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-soft); margin: 0 0 10px; }
.heads { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.head { border-radius: 8px; padding: 10px 12px; min-width: 0; }
.head.ukr { background: var(--ukr-lo); }
.head.rus { background: var(--rus-lo); }
.head .lbl { font-size: 12px; color: var(--ink-soft); }
.head .num { font-family: var(--font-display); font-weight: 800; font-stretch: 105%; font-size: 26px; line-height: 1.15; margin-top: 2px; font-variant-numeric: tabular-nums; }
.head.ukr .num { color: var(--ukr); }
.head.rus .num { color: var(--rus); }
.head .sub { font-family: var(--font-data); font-size: 11.5px; color: var(--ink-soft); margin-top: 4px; line-height: 1.5; }
.split { display: flex; height: 8px; border-radius: 4px; overflow: hidden; margin-top: 10px; background: var(--mid); }
.split div { height: 100%; }
.split-cap { font-size: 12.5px; color: var(--ink-soft); margin-top: 6px; }
.note { font-size: 13.5px; line-height: 1.45; margin: 8px 0 0; }
.note b { font-weight: 600; }
.trend svg { width: 100%; height: auto; display: block; overflow: visible; }
.trend text { font-family: var(--font-data); font-size: 10px; fill: var(--ink-soft); }
.cats { display: grid; gap: 9px; }
.cat { display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; align-items: baseline; font-size: 13.5px; }
.cat .name { min-width: 0; }
.cat .val { font-family: var(--font-data); font-size: 12.5px; text-align: right; font-variant-numeric: tabular-nums; }
.cat .track { grid-column: 1 / -1; height: 7px; background: var(--mid); border-radius: 4px; position: relative; overflow: hidden; }
.cat .fill { position: absolute; inset: 0 auto 0 0; border-radius: 4px; }
.cat .range { position: absolute; top: 0; bottom: 0; opacity: 0.35; }
.chip { display: inline-block; font-family: var(--font-data); font-size: 10.5px; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin-left: 6px; color: var(--ink-soft); vertical-align: 1px; }
.chip.c, .chip.d { border-style: dashed; }
.people { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.people > div { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.people .n { font-family: var(--font-display); font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; }
.people .l { font-size: 12px; color: var(--ink-soft); }
.sources { font-size: 12.5px; color: var(--ink-soft); line-height: 1.6; margin: 0; padding-left: 18px; }
.src-more summary { cursor: pointer; color: var(--ink-soft); font-size: 12px; }
.src-links { margin: 2px 0 6px; padding-left: 16px; list-style: disc; }
.src-kind { font-size: 11px; opacity: 0.8; }
.how { font-size: 11px; margin-left: 4px; text-decoration: none; opacity: 0.75; }
.trace { font-size: 11.5px; margin-left: 5px; text-decoration: none; opacity: 0.75; font-weight: 600; }
.trace:hover, .how:hover { opacity: 1; }
.key { font-size: 12px; color: var(--ink-soft); line-height: 1.5; }
.empty { color: var(--ink-soft); font-size: 13.5px; }

.hint { position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%); background: var(--surface); border: 1px solid var(--line);
  border-radius: 999px; padding: 6px 14px; font-size: 13px; color: var(--ink-soft); z-index: 2; width: max-content; max-width: calc(100% - 140px); text-align: center; transition: opacity 0.4s; }

@media (max-width: 900px) {
  .controls { margin-left: 0; }
  .search input { width: 150px; }
  .legend { width: 200px; padding: 8px 10px; }
  .panel { top: auto; left: 0; right: 0; bottom: 0; width: auto; max-width: none; max-height: 62%; border-radius: 14px 14px 0 0;
    padding-bottom: env(safe-area-inset-bottom, 0px); }
  .panel[data-open="false"] { transform: translateY(105%); }
  .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { .panel, .country, .hint { transition: none; } }

/* v2: flow layer, change view */
#flows { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
#labels { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; overflow: hidden; }
.seg button[data-lens="change"][aria-pressed="true"] { background: linear-gradient(90deg, var(--rus-text), var(--ukr)); color: var(--on-accent); }
.seg button[data-lens="cost"][aria-pressed="true"] { background: var(--ukr); color: var(--on-accent); }
.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-soft); cursor: pointer; white-space: nowrap; }
.toggle input { accent-color: var(--ukr); }
.legend .flowkey[hidden] { display: none; }
.legend .flowkey { display: grid; gap: 4px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); color: var(--ink-soft); }
.legend .flowkey svg { vertical-align: -2px; margin-right: 6px; }
.big { font-family: var(--font-display); font-weight: 800; font-stretch: 108%; font-size: 34px; line-height: 1.05; font-variant-numeric: tabular-nums; }
.big.pos { color: var(--ukr); }
.big.neg { color: var(--rus); }
.big-cap { font-size: 13.5px; color: var(--ink-soft); margin-top: 4px; line-height: 1.4; }
.big-cap b { color: var(--ink); font-weight: 600; }
.wf { display: grid; gap: 7px; margin-top: 14px; }
.wf-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; font-size: 13px; }
.wf-row .val { font-family: var(--font-data); font-size: 12.5px; text-align: right; font-variant-numeric: tabular-nums; }
.wf-row .val small, .kv .v small { display: block; font-size: 10.5px; color: var(--ink-soft); }
.wf-row .val small { white-space: nowrap; }
.wf-row .track { grid-column: 1 / -1; position: relative; height: 14px; }
/* the likely range: a pale band in the part's own colour, behind the bar */
.wf-row .track .band { position: absolute; top: 0; bottom: 0; border-radius: 3px; opacity: 0.22; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .wf-row .track .band { opacity: 0.32; } }
:root[data-theme="dark"] .wf-row .track .band { opacity: 0.32; }
.wf-row .track .axis { position: absolute; top: -2px; bottom: -2px; width: 1px; background: var(--ink-soft); opacity: 0.6; }
.wf-row .track .seg2 { position: absolute; top: 4px; bottom: 4px; border-radius: 2px; }
.country.earner-line { stroke: #bfa233; stroke-width: 1.6px; vector-effect: non-scaling-stroke; }
.balances { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0 4px; }
.balances .bal { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.balances .bal .lbl { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-soft); }
.balances .bal .num { font-family: var(--font-data); font-size: 19px; font-weight: 600; margin: 2px 0; }
.balances .bal.pos .num { color: var(--ukr); } .balances .bal.neg .num { color: var(--rus-text, var(--rus)); } .balances .bal.earn .num { color: var(--back); }
.balances .bal .s { font-size: 11.5px; color: var(--ink-soft); line-height: 1.35; }
.wf-row.total { font-weight: 600; padding-top: 6px; border-top: 1px solid var(--line); }
.costs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
.costs > div { border: 1px solid var(--line); border-radius: 8px; padding: 8px 9px; min-width: 0; }
.costs .n { font-family: var(--font-data); font-size: 13px; font-variant-numeric: tabular-nums; }
.costs .l { font-size: 11.5px; color: var(--ink-soft); line-height: 1.3; margin-top: 2px; }
.mini { margin-top: 4px; }
.mini + .mini { margin-top: 16px; }
.mini .t { font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
.mini .t span { font-family: var(--font-data); font-weight: 400; font-size: 12px; color: var(--ink-soft); }
.mini svg { width: 100%; height: auto; display: block; margin-top: 4px; overflow: visible; }
.mini text { font-family: var(--font-data); font-size: 10px; fill: var(--ink-soft); }
.how { font-size: 12.5px; color: var(--ink-soft); line-height: 1.55; margin: 0; padding-left: 18px; }
.how b { color: var(--ink); font-weight: 600; }
@media (max-width: 900px) { .costs { grid-template-columns: 1fr 1fr; } .big { font-size: 28px; } }

/* v3: rankings, compare, sources, phone */
.bar .menu-btn { display: none; margin-left: auto; border: 1px solid var(--line); background: transparent; border-radius: 6px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 6px 11px; font-size: 13px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--ink-soft); }
.btn.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.play { width: 30px; height: 30px; padding: 0; display: inline-grid; place-items: center; border-radius: 50%; }
.ref { font-family: var(--font-data); font-size: 11px; color: var(--ink-soft); margin-left: 2px; vertical-align: super; line-height: 0; white-space: nowrap; }
.ref a { color: inherit; text-decoration: none; }
.ref a:hover { text-decoration: underline; }
.range-txt { font-family: var(--font-data); font-size: 12px; color: var(--ink-soft); margin-top: 4px; }
.status { background: var(--warn-bg); color: var(--warn-ink); font-size: 12px; border-bottom: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
.status[data-open="true"] { white-space: normal; }
.status b { color: var(--ink); }
.layers { position: relative; }
.layers summary { list-style: none; }
.layers summary::-webkit-details-marker { display: none; }

// All numbers come from data.json (built by build_data.py from the research files). Amounts are € billions.
let YEARS = [2021, 2022, 2023, 2024, 2025, 2026], FRAC = [1, 1, 1, 1, 1, 1], SRC = {}, META = {};
let DATA = {}, byIso = {}, INCLUDED = {};
const RANGE = { A: 0.05, B: 0.15, C: 0.35, D: 0.7 };   // default ± share (~90% range) when the data gives no range
const CERT_ORDER = "ABCD";
const KYIV = [30.52, 50.45], MOSCOW = [37.62, 55.75];
const yi = y => YEARS.indexOf(y);
const zeros = () => YEARS.map(() => 0);
const arr = a => (Array.isArray(a) ? a.map(v => v || 0) : zeros());
const weakest = list => list.filter(Boolean).reduce((w, c) => (CERT_ORDER.indexOf(c) > CERT_ORDER.indexOf(w) ? c : w), "A");

// Each series is a triple: central, low and high values per year (low = high = central when the data gives no range).
function triple(obj, key) {
  const c = arr(obj && obj[key]);
  const l = obj && obj[key + "_lo"] ? arr(obj[key + "_lo"]) : c;
  const h = obj && obj[key + "_hi"] ? arr(obj[key + "_hi"]) : c;
  // alternative pre-war baselines (e.g. the 2019-2021 average) widen the range of the 2021 value
  const b = obj && obj.base_range ? obj.base_range : [c[0], c[0]];
  const m = obj && obj.base != null ? obj.base : c[0];   // pre-war level used as the middle value
  // price level per year against 2019-2021 (= 1): changes against the pre-war level compare volumes, not price swings
  const ones = YEARS.map(() => 1);
  const p = obj && obj.pidx ? obj.pidx : ones, pl = obj && obj.pidx_lo ? obj.pidx_lo : p, ph = obj && obj.pidx_hi ? obj.pidx_hi : p;
  // expected path without the war against the pre-war level (1 = flat): the back-tested counterfactual, or a pre-war trend
  const q = obj && obj.bmul ? obj.bmul : ones, ql = obj && obj.bmul_lo ? obj.bmul_lo : q, qh = obj && obj.bmul_hi ? obj.bmul_hi : q;
  // 2021 alone is an alternative baseline, at pre-war prices
  // range of the expected total over 1-5 years, measured on the back-tests' summed errors (round 6)
  const cb = key === "years" && obj && obj.cb ? obj.cb : null;
  // range of the no-war fuel price, as factors on the expected path (payments to Russia, round 7)
  const nr = key === "years" && obj && obj.nrl ? [obj.nrl, obj.nrh] : null;
  // round 14 (M5): each year's change in volume is valued at that year's prices (current euros, like aid)
  const cur = key === "years" && obj && obj.cur ? obj.cur : null;
  return { c, l, h, m, b: [Math.min(b[0], l[0] / ph[0], m), Math.max(b[1], h[0] / pl[0], m)], p, pl, ph, q, ql, qh, cb, nr, cur };
}
function normalise(c) {
  c.T = {
    aid: triple(c.aid, "years"), ref: triple(c.aid, "refugee_years"),
    paid: triple(c.to_rus, "years"), laundered: triple(c.laund || c.to_rus, c.laund ? "years" : "laundered"), soldRus: triple(c.from_rus, "years"),
    buyUkr: triple(c.buy_ukr, "years"), sellUkr: triple(c.sell_ukr, "years"),
    own: triple(c.flowback, "own"), purl: triple(c.flowback, "purl_in"), arms: triple(c.flowback, "arms"), othsp: triple(c.flowback, "othsp"),
    premium: triple(c.energy, "premium"), discount: triple(c.energy, "discount"),
    tax: triple(c.company, "taxes"), mil: triple(c.military_rus, "years"),
    svcBought: triple(c.svc_bought, "years"), svcSold: triple(c.svc_sold, "years"), ship: triple(c.shipping, "years"), windfall: triple(c.windfall, "years"),
    hidden: triple(c.hidden, "years"), undisc: triple(c.undisclosed, "years"), priv: triple(c.private, "years"),
  };
  // the seller's net gain per euro (round 10): Russia's on purchases from it, Ukraine's on extra purchases from it
  const gw = w => (w ? { e: w } : null);
  c.T.paid.g = c.to_rus?.gain || null; c.T.laundered.g = c.to_rus?.laund_gain || null;
  c.T.svcBought.g = gw(c.svc_bought?.gain); c.T.buyUkr.g = gw(c.buy_ukr?.gain);
  c.aidY = c.T.aid.c; c.refY = c.T.ref.c; c.paidY = c.T.paid.c; c.launderedY = c.T.laundered.c; c.soldRusY = c.T.soldRus.c;
  c.buyUkrY = c.T.buyUkr.c; c.sellUkrY = c.T.sellUkr.c; c.ownY = c.T.own.c; c.purlY = c.T.purl.c;
  c.premiumY = c.T.premium.c; c.discountY = c.T.discount.c; c.taxY = c.T.tax.c; c.milY = c.T.mil.c;
  return c;
}

const state = { lens: "change", measure: "gdp", year: 2026, selected: null, compare: null, panel: null,
  flows: true, netBack: true, chpl: true, remit: true, rankMetric: "shift", rankMeasure: "gdp", tableSort: "shiftGdp", flow: null };


// Every number is a part with a middle value, a low and a high (a ~90% range) and a certainty letter.
// Ranges come from the data where it has them; otherwise from the certainty letter. Totals combine the parts'
// margins as errors (square root of the sum of squares), with the measured correlations in RHO.
// Correlation of the counterfactual's errors between flows of the same country, measured in its back-tests (median of
// the 2008, 2013 and 2016 tests; research/2026-10/gaps/counterfactual-notes.md). Other pairs are independent.
// parts of the balance with Ukraine: what a country gave (money flowing back is subtracted from it)
const UA_PARTS = new Set(["aid", "euaid", "ref", "buy", "undisc", "priv", "multilat"]);
// Round 13 (audit): parts that share inputs are correlated too, not only expected trade. EU-level aid takes the
// country's own aid range by construction (1); aid and its own flowback move together, so their errors offset in the
// total (-0.5, judgement); parts weighted by Russia's net-gain shares share them (0.5, judgement); flowback parts weighted
// by the same weapons gain share (0.5); Russia-side shocks move purchases from and sales to Russia (0.2, judgement)
const RHO = { "svcpaid|svcsold": 0.4, "paid|svcpaid": 0.25, "sold|svcpaid": 0.2, "sold|svcsold": 0.2, "paid|svcsold": 0.15,
  "aid|euaid": 1, "aid|own": -0.5, "paid|laund": 0.5, "paid|hidden": 0.5, "laund|hidden": 0.5, "paid|rusarms": 0.5, "paid|sold": 0.2,
  "own|purl": 0.5, "own|arms": 0.5, "purl|arms": 0.5 };
// opt (round 13, the method band): rule "old" = value kept x genuinely extra for sellers (until round 12) and weapons
// sent to Russia in full; windfall "full" = the war-time price windfall at 100%; loans "war" = loans discounted at the
// war-time yield instead of Ukraine's 2021 rate. Migrants' remittances are a marker since round 13b, in no total and no
// alternative (remitNote)
function calc(c, y, opt = {}) {
  const N = yi(y), T = c.T;
  const sum3 = t => { const r = [0, 0, 0]; for (let i = 1; i <= N; i++) { r[0] += t.c[i]; r[1] += t.l[i]; r[2] += t.h[i]; } return r; };
  // change against the pre-war level, at pre-war prices (actual values divided by the price level): the low end uses
  // the low baseline, the high actual value and the low price level, and the other way round
  // expected without the war = pre-war level x pre-war trend; the low end takes the low baseline and trend
  // Ranges combine four independent sources of uncertainty in quadrature instead of stacking their worst cases:
  // the baseline level and the actual values (from the same sources, so their errors partly cancel: correlation 0.5),
  // the price level and the pre-war trend. Errors are summed over the years first (the same baseline every year).
  const spread = (t, ex, act) => {
    // ex(i, base, trend) and act(i, value, price) give one year's expected and actual volume; round 14 (M5): both
    // valued at that year's prices (t.cur), so every trade part is in current euros like aid
    if (t.cur) { const ex1 = ex, act1 = act, k = t.cur; ex = (i, b, q) => ex1(i, b, q) * k[i]; act = (i, v, p) => act1(i, v, p) * k[i]; }
    let mid = 0, bl = 0, bh = 0, al = 0, ah = 0, pl = 0, ph = 0, ql = 0, qh = 0, se = 0, nl = 0, nh = 0;
    // trade counts at the seller's net gain (round 10): t.g = { e, a } weights per year, [low, central, high] each, for
    // what was expected (the pre-war mix of goods) and what was bought; their range is one more term in quadrature
    const ge = i => (t.g ? t.g.e[1][i] : 1), ga = i => (t.g ? (t.g.a || t.g.e)[1][i] : 1);
    let gl = 0, gh = 0;
    if (t.g) {
      const ex0 = ex, act0 = act;
      ex = (i, b, q) => ex0(i, b, q) * ge(i); act = (i, v, p) => act0(i, v, p) * ga(i);
      for (let i = 1; i <= N; i++) {
        const e = ex0(i, t.m, t.q[i]), a = act0(i, t.c[i], t.p[i]), A = t.g.a || t.g.e;
        const v = e * ge(i) - a * ga(i), lo = e * t.g.e[0][i] - a * A[0][i], hi = e * t.g.e[2][i] - a * A[2][i];
        gl += v - Math.min(v, lo, hi); gh += Math.max(v, lo, hi) - v;
      }
    }
    for (let i = 1; i <= N; i++) {
      const e = ex(i, t.m, t.q[i]), a = act(i, t.c[i], t.p[i]);
      mid += e - a; se += e;
      if (t.nr) { nl += e * (1 - t.nr[0][i]); nh += e * (t.nr[1][i] - 1); }
      bl += e - ex(i, t.b[0], t.q[i]); bh += ex(i, t.b[1], t.q[i]) - e;
      al += act(i, t.h[i], t.p[i]) - a; ah += a - act(i, t.l[i], t.p[i]);
      pl += act(i, t.c[i], t.pl[i]) - a; ph += a - act(i, t.c[i], t.ph[i]);
      ql += e - ex(i, t.m, t.ql[i]); qh += ex(i, t.m, t.qh[i]) - e;
    }
    // the expected total's own measured band replaces the sum of the yearly bands
    if (t.cb && t.cb[N]) { ql = (1 - t.cb[N][0]) * se; qh = (t.cb[N][1] - 1) * se; }
    const lo = Math.sqrt(Math.max(0, bl * bl + al * al - bl * al) + pl * pl + ql * ql + nl * nl + gl * gl);
    const hi = Math.sqrt(Math.max(0, bh * bh + ah * ah - bh * ah) + ph * ph + qh * qh + nh * nh + gh * gh);
    return [mid, mid - lo, mid + hi];
  };
  const exV = (i, base, q) => base * FRAC[i] * q, actV = (i, v, p) => v / p;
  // change against the pre-war level at pre-war prices: positive = less than expected
  const delta3 = t => spread(t, exV, actV);
  // only the rise above the expected level. Round 13 (audit): the yearly changes are summed with their signs and only
  // the total is floored at zero (flooring each year gave noisy series a positive value when the true change was 0)
  const above3 = t => { const r = [0, 0, 0]; for (let i = 1; i <= N; i++) { const one = spreadYear(t, i); r[0] += one[0]; r[1] += one[1]; r[2] += one[2]; } return r.map(v => Math.max(0, v)); };
  const spreadYear = (t, i) => { const d = spread({ ...t, c: t.c.map((v, j) => (j === i ? v : 0)), l: t.l.map((v, j) => (j === i ? v : 0)), h: t.h.map((v, j) => (j === i ? v : 0)), m: t.m, b: t.b, q: t.q.map((v, j) => (j === i ? v : 0)), ql: t.ql.map((v, j) => (j === i ? v : 0)), qh: t.qh.map((v, j) => (j === i ? v : 0)), cb: null, nr: null }, exV, actV); return [-d[0], -d[2], -d[1]]; };
  const neg = r => [-r[0], -r[2], -r[1]];
  // a yearly series weighted by a gain share per year ([low, central, high]); without one, the plain sum
  const sumG = (t, w) => { if (!w) return sum3(t); const r = [0, 0, 0]; for (let i = 1; i <= N; i++) { r[0] += t.c[i] * w[1][i]; r[1] += t.l[i] * w[0][i]; r[2] += t.h[i] * w[2][i]; } return r; };
  const scale = (r, f) => [r[0] * f, r[1] * f, r[2] * f];
  const aid3 = sum3(T.aid), ref3 = sum3(T.ref);
  // EU-level aid (EU budget, Ukraine Facility, EPF) is split over members by their share of EU budget contributions;
  // shown as its own part, with the same relative range as the country's aid
  const eu = c.aid?.eu_years ? c.aid.eu_years.slice(1, N + 1).reduce((a, b) => a + b, 0) : 0;
  const eu3 = aid3[0] ? [eu, eu * aid3[1] / aid3[0], eu * aid3[2] / aid3[0]] : [eu, eu, eu];
  // donated weapons at market value (the value to Ukraine) for the shift; the cost view keeps the recorded values
  const wmv = c.aid?.weapons_mv, wmv3 = [0, 0, 0];
  if (wmv) for (let i = 1; i <= N; i++) { wmv3[0] += wmv.c[i]; wmv3[1] += wmv.l[i]; wmv3[2] += wmv.h[i]; }
  // loans at their economic value to Ukraine (the grant element), for the country's own aid and its EU-level share
  const adj3 = a => { const r = [0, 0, 0]; if (a) for (let i = 1; i <= N; i++) { r[0] += a.c[i]; r[1] += a.l[i]; r[2] += a.h[i]; } return r; };
  const war = a => (a && opt.loans === "war" ? { c: a.h, l: a.h, h: a.h } : a);
  const lOwn = adj3(war(c.aid?.loan_adj_own)), lEu = adj3(war(c.aid?.loan_adj_eu));
  for (let j = 0; j < 3; j++) eu3[j] += lEu[j];
  const ownAid3 = [aid3[0] - (eu3[0] - lEu[0]) + wmv3[0] + lOwn[0], aid3[1] - (eu3[1] - lEu[1]) + wmv3[1] + lOwn[1], aid3[2] - (eu3[2] - lEu[2]) + wmv3[2] + lOwn[2]];
  const aidAll = T.aid.c.reduce((a, b) => a + b, 0) || 1;
  const loanShare = c.aid && c.aid.loans_face ? Math.min(1, aid3[0] / aidAll) : 0;
  const loansFace = (c.aid?.loans_face || 0) * loanShare;
  // fallback only: every country with loans has loans_grant_eq in data.json (LOAN_GRANT_ELEMENT, docs/decisions.md)
  const loansGE = (c.aid?.loans_grant_eq ?? (c.aid?.loans_face || 0) * 0.26) * loanShare;
  // the lender's cost per loan, low and high (round 12, docs/method/loans.md); half and one and a half times otherwise
  const loansGELo = c.aid?.loans_grant_eq_lo != null ? c.aid.loans_grant_eq_lo * loanShare : loansGE * 0.5;
  const loansGEHi = c.aid?.loans_grant_eq_hi != null ? c.aid.loans_grant_eq_hi * loanShare : loansGE * 1.5;
  const lessTax3 = T.tax.m ? delta3(T.tax) : [0, 0, 0];
  const shipT = opt.rule === "old" && c.shipping?.years_old ? { ...T.ship, c: c.shipping.years_old, l: c.shipping.years_old, h: c.shipping.years_old, m: c.shipping.base_old } : T.ship;
  const lessSold3 = delta3(T.soldRus), lessSvcSold3 = delta3(T.svcSold), lessSvcPaid3 = delta3(T.svcBought), lessShip3 = c.shipping ? delta3(shipT) : [0, 0, 0];
  const margin = META.lost_margin ?? 0.2;
  // income lost on goods and services no longer sold to Russia
  // money earned counts at the value kept in the economy x how much of it is genuinely extra (round 6), per country and
  // kind of earning (c.vk: [low, central, high]); the flat 20% margin (META.lost_margin) is only a fallback for a
  // country without c.vk, and every country in the current data has one
  const VK = opt.rule === "old" ? c.vk_old : c.vk;
  const vk = key => (VK && VK[key]) || [margin * 0.5, margin, margin * 1.5];
  const earned3 = (r, kPos, kNeg) => {
    const f = vk(r[0] >= 0 ? kPos : kNeg);
    return [r[0] * f[1], r[1] * (r[1] >= 0 ? f[0] : f[2]), r[2] * (r[2] >= 0 ? f[2] : f[0])];
  };
  const lostS = earned3(lessSold3.map(v => Math.max(0, v)), "rl", "rl"), lostV = earned3(lessSvcSold3.map(v => Math.max(0, v)), "sl", "sl");
  const lostMargin3 = [lostS[0] + lostV[0], lostS[1] + lostV[1], lostS[2] + lostV[2]];
  // selling to Russia (or giving it up) moves the seller's income, not the whole sales value: only the value kept in
  // the economy x the share that is genuinely extra counts (c.vk above; docs/method/overview.md, the money rule)

  const tariff3 = c.tariff_waiver ? scale(sum3(T.buyUkr), META.tariff_rate ?? 0.002) : [0, 0, 0];
  // round 13 (audit): a part built on the modelled no-war level and a modelled share (net gain, genuinely extra) stacks
  // two models, so it is at best C, a modelled estimate (docs/method/ranges.md, certainty letters)
  const cAid = c.aid?.cert || "B", cRus = weakest([c.to_rus?.cert, "C"]), cTrade = weakest([c.buy_ukr?.cert, "C"]);
  const src = k => (c[k]?.src || []);
  const part = (k, label, r, cert, srcs) => {
    let [v, lo, hi] = r;
    lo = Math.min(lo, v); hi = Math.max(hi, v);
    if (Math.abs(hi - lo) < 1e-9) { lo = v - Math.abs(v) * RANGE[cert]; hi = v + Math.abs(v) * RANGE[cert]; }
    // a * marks parts whose 2026 (January to August) is estimated from the 2025 monthly rate
    const est = { tax: "company", sold: "from_rus", paid: "to_rus" }[k];
    const star = est && c[est]?.est26 ? " *" : "";
    return { k, label: t(label) + star, en: label + star, v, lo, hi, cert, src: srcs };
  };
  const lessPaid3 = delta3(T.paid);
  const shiftParts = [
    // Kiel's figure, adjusted (round 13 audit: the label says so): weapons at market value, loans at their gift
    part("aid", "Aid to Ukraine (Kiel, adjusted: weapons at market value, loans as gifts)", ownAid3, cAid, src("aid")),
    part("euaid", "Share of EU-level aid", eu3, "B", c.aid?.eu_src || ["kiel_eu_share"]),
    part("ref", "Hosting refugees", ref3, c.aid?.refugee_cert || "B", c.aid?.refugee_src || []),
    part("buy", "Extra purchases from Ukraine", above3(T.buyUkr), cTrade, src("buy_ukr")),
    part("paid", lessPaid3[0] >= 0 ? "Less paid to Russia" : "More paid to Russia", lessPaid3, cRus, src("to_rus")),
    // against the prices a no-war market expected; negative where Russia sold below them (price cap, discounts)
    part("windfall", sum3(T.windfall)[0] >= 0 ? "Extra paid to Russia because of war-time prices" : "Paid Russia less than no-war prices (discounts, price cap)", neg(opt.windfall === "full" && c.windfall?.alt ? sum3({ c: c.windfall.alt, l: c.windfall.alt, h: c.windfall.alt }) : sum3(T.windfall)), c.windfall?.cert || "C", src("windfall")),
    // round 13: in volumes like every other trade part (the crude inside the fuel at no-war crude prices, against its
    // pre-war level), counted both ways, at Russia's net gain on crude
    part("laund", "Russian oil bought via other countries", c.laund ? delta3(T.laundered) : neg(sum3(T.laundered)), "C", c.to_rus?.laundered_src || []),
    part("sold", lessSold3[0] >= 0 ? "Income lost on sales to Russia given up" : "Income from extra sales to Russia", earned3(lessSold3, "rl", "rx"), weakest([c.from_rus?.cert, "C"]), src("from_rus")),
    part("tax", lessTax3[0] >= 0 ? "Less tax paid in Russia by companies" : "More tax paid in Russia by companies", lessTax3, c.company?.cert || "B", src("company")),
    part("mil", "Weapons and troops sent to Russia", neg(opt.rule === "old" && c.military_rus?.alt ? sum3({ c: c.military_rus.alt, l: c.military_rus.alt, h: c.military_rus.alt }) : sum3(T.mil)), c.military_rus?.cert || "D", src("military_rus")),
    part("svcpaid", lessSvcPaid3[0] >= 0 ? "Less paid to Russia for services" : "More paid to Russia for services", lessSvcPaid3, weakest([c.svc_bought?.cert, "C"]), src("svc_bought")),
    part("svcsold", lessSvcSold3[0] >= 0 ? "Income lost on services to Russia given up (e.g. tourism)" : "Income from extra services sold to Russia (e.g. tourism)", earned3(lessSvcSold3, "sl", "sx"), weakest([c.svc_sold?.cert, "C"]), src("svc_sold")),
    part("ship", lessShip3[0] >= 0 ? "Less income from shipping Russian oil" : "Income from shipping and insuring Russian oil", lessShip3, c.shipping?.cert || "D", src("shipping")),
    // gold and hidden payments are money in data.json (the "To Russia" view); here at Russia's gain on gold
    part("hidden", "Gold and hidden payments to Russia", neg(sumG(T.hidden, c.hidden?.gain)), "D", src("hidden")),
    part("undisc", "Undisclosed military aid (estimate)", sum3(T.undisc), c.undisclosed?.cert || "D", src("undisclosed")),
    part("priv", "Private donations", sum3(T.priv), c.private?.cert || "D", src("private")),
    // parts without a series of their own (state loans, arms bought from Russia, company exits...): yearly change
    // against the pre-war level, already as the shift toward Ukraine
    ...(c.extra || []).map(x => { const s3 = [0, 0, 0], old = opt.rule === "old" && x.alt; for (let i = 1; i <= N; i++) { s3[0] += old ? x.alt[i] : x.c[i]; s3[1] += old ? x.alt[i] : x.l[i]; s3[2] += old ? x.alt[i] : x.h[i]; } return part(x.k, x.label, s3, x.cert, x.src); }),
  ];
  const sell3 = above3(T.sellUkr);
  const backParts = [
    part("own", "Own aid spent in its own economy (incl. replacing donated stock)", sum3(T.own), c.flowback?.cert_own || "C", src("flowback")),
    part("purl", "Other countries' aid spent here (incl. their stock replacement)", sum3(T.purl), c.flowback?.cert_own || "C", c.flowback?.purl_src || src("flowback")),
    part("sell", "Extra sales to Ukraine above the pre-war level", sell3, cTrade, src("sell_ukr")),
    part("arms", "Arms Ukraine bought here", sum3(T.arms), c.flowback?.arms_cert || "C", c.flowback?.arms_src || []),
    part("othsp", "Aid spent here on energy, relief and rebuilding", sum3(T.othsp), c.flowback?.cert_own || "C", c.flowback?.src || []),
  ];
  const costParts = [
    part("aidge", "Aid given (loans at grant equivalent)", [aid3[0] - loansFace + loansGE, aid3[1] - loansFace + loansGELo, aid3[2] - loansFace + Math.min(loansFace, loansGEHi)], loansFace ? weakest([cAid, "C"]) : cAid, src("aid")),
    part("ref", "Hosting refugees", ref3, c.aid?.refugee_cert || "B", c.aid?.refugee_src || []),
    part("undisc", "Undisclosed military aid (estimate)", sum3(T.undisc), c.undisclosed?.cert || "D", src("undisclosed")),
    part("priv", "Private donations", sum3(T.priv), c.private?.cert || "D", src("private")),
    part("prem", "Extra paid to replace Russian energy", sum3(T.premium), c.energy?.cert || "C", c.energy?.src || []),
    part("margin", "Income lost on sales to Russia (goods and services)", lostMargin3, "C", src("from_rus").concat(src("svc_sold"))),
    part("tariff", "Import tariffs dropped for Ukraine", tariff3, "C", src("buy_ukr")),

// the one-line summary of a country: shared, and read out when its panel opens

const EARNED_PARTS = new Set(["mil", "sold", "svcsold", "ship", "agents"]);

  if (k.rusBal >= 0) {

    const top = pos[0], mostly = top && top.k !== "paid" && LESS_MOSTLY[top.k] && top.v >= 0.4 * k.rusBal ? LESS_MOSTLY[top.k] : null;
    const cut = k.rusCut > 0.005 ? eur(k.rusCut) : null;

    const tr = tr0 + (cut ? t(", of which {v} gas cut off by Russia", { v: cut }) : "");

function waterfall(parts, total, totalLabel, totalLo, totalHi) {
  // each part on its own bar from zero, with its likely range as a capped line; the total below on the same scale.
  // (A running waterfall made small parts a sliver far from the axis, with a range line that was hard to read.)
  const ends = parts.flatMap(p => [p.v].concat(p.lo != null ? [p.lo, p.hi] : [])).concat([total], totalLo != null ? [totalLo, totalHi] : []);
  const lo = Math.min(0, ...ends), hi = Math.max(0, ...ends);
  const x = v => ((v - lo) / (hi - lo || 1)) * 100;
  const bar = (a, b, col, op = 1) => `<div class="seg2" style="left:${x(Math.min(a, b))}%;width:${Math.max(0.8, Math.abs(x(b) - x(a)))}%;background:${col};opacity:${op}"></div>`;
  const axis = `<div class="axis" style="left:${x(0)}%"></div>`;
  const rng = (a, b) => `<small>${rangeTxt(a, b)}</small>`;
  const band = (l, h, col) => l == null ? "" : `<div class="band" style="left:${x(Math.min(l, h))}%;width:${Math.max(0.8, Math.abs(x(h) - x(l)))}%;background:${col}"></div>`;
  const colOf = s => ["own", "purl", "sell", "arms", "othsp"].includes(s.k) ? "var(--back)" : s.v >= 0 ? "var(--ukr)" : "var(--rus)";
  const upto = Math.max(2022, state.year);
  return `<div class="wf"><div class="key">${t("Totals for 2022–{y}{ytd}, all years added up. Bar: each part; pale band: its likely range.", { y: upto, ytd: upto === 2026 && FRAC[5] < 1 ? t(" (2026 year to date, Jan–Aug)") : "" })}</div>${parts.map(s => `<div class="wf-row"><span>${s.label}${howLink(s.k)}${traceLink(s.k)}${chip(s.cert)}${ref(s.src)}</span><span class="val">${eur(s.v, true)}${s.lo != null ? rng(s.lo, s.hi) : ""}</span>
      <div class="track">${band(s.lo, s.hi, colOf(s))}${axis}${bar(0, s.v, colOf(s), s.cert === "C" || s.cert === "D" ? 0.75 : 1)}</div></div>`).join("")}
    <div class="wf-row total"><span>${totalLabel}</span><span class="val">${eur(total, true)}${totalLo != null ? `<small>${rangeTxt(totalLo, totalHi)}</small>` : ""}</span>
      <div class="track">${band(totalLo, totalHi, total >= 0 ? "var(--ukr)" : "var(--rus)")}${axis}${bar(0, total, total >= 0 ? "var(--ukr)" : "var(--rus)")}</div></div></div>`;
}

function comparePanel(a, b) {
  const y = Math.max(2022, state.year), ka = calc(a, y), kb = calc(b, y);

    ["Net shift", x => x.k.shift, "total", true],
    ["Net shift per person", x => x.k.shift, "pp", true],
    ["Support for Ukraine, % of a year's GDP", x => x.k.uaBal, "gdp", true],
    ["Change in payments to Russia, % of a year's GDP", x => x.k.rusBal, "gdp", true],
    ["Cost, % of a year's GDP", x => x.k.cost, "gdp", false],
    ["Cost carried", x => x.k.cost, "total", false],
    ["Cost per person", x => x.k.cost, "pp", false],
    ["Aid to Ukraine", x => x.k.aid, "total", false],
    ["Money flowing back", x => x.k.flowback, "total", false],
    ["Paid to Russia since 2022", x => x.k.paidRussia, "total", false],
    ["Paid to Russia, change vs before the war", x => { const T = x.c.T.paid, i = Math.max(1, yi(y)); return T.m ? (T.c[i] / FRAC[i] / (T.p[i] || 1) / (T.m * (T.q[i] || 1)) - 1) * 100 : null; }, "pct", true],
  ];
  const A = { c: a, k: ka }, B = { c: b, k: kb };
  const fmt = (x, f, m, sg) => { const v = f(x); if (v == null) return "–"; if (m === "pct") return (v >= 0 ? "+" : "−") + Math.abs(Math.round(v)) + "%"; return fmtMeasure(x.c, v, m, sg, false); };
  const val = (x, f, m) => { const v = f(x); return m === "pct" ? v : scaled(x.c, v, m); };
  return head(t("{a} vs {b}", { a: a.name, b: b.name }), `${periodText()}`) + `<div class="panel-body">
    <div class="panel-tools"><button class="btn" id="compare-back">${t("← Back to {name}", { name: a.name })}</button></div>

      <span></span><span class="h">${a.name}</span><span class="h">${b.name}</span>
      ${rows.map(([lab, f, m, sg]) => {
        const va = val(A, f, m), vb = val(B, f, m), mx = Math.max(Math.abs(va || 0), Math.abs(vb || 0)) || 1;
        const barc = v => (v == null ? "" : `<div class="b" style="width:${(Math.abs(v) / mx) * 100}%;background:${v >= 0 ? (lab.startsWith("Paid") ? "var(--rus)" : lab.includes("back") ? "var(--back)" : "var(--ukr)") : (lab.startsWith("Paid") ? "var(--ukr)" : "var(--rus)")}"></div>`);
        return `<span class="lab">${t(lab)}</span><span class="cell">${fmt(A, f, m, sg)}${barc(va)}</span><span class="cell">${fmt(B, f, m, sg)}${barc(vb)}</span>`;
      }).join("")}
    </div></section>
    <div class="panel-tools"><button class="btn" data-goto="${b.n}">${t("Open {name}", { name: b.name })}</button></div>
  </div>`;
}

// Every ranking row shows 1. % of GDP (what the map colours by) and 2. the net amount in euros.
// Sorted by % of GDP unless "net €" is chosen. Very small economies swing wildly on tiny amounts, so they are left out.
// rangeFn (optional) gives the likely range; countries whose range crosses zero are left out, because their sign is uncertain
function rankList(list, metricFn, _measure, colourFn, n = 20, rangeFn = null) {
  const byEur = state.rankMeasure === "total";
  const rows = list.filter(c => (c.gdp || 0) >= MIN_GDP_RANK && (!rangeFn || rangeFn(c)[0] > 0))
    .map(c => { const eurV = metricFn(c); return { c, eurV, pct: scaled(c, eurV, "gdp") }; })
    .filter(r => r.pct != null && r.eurV > 0)
    .sort((a, b) => (byEur ? b.eurV - a.eurV : b.pct - a.pct)).slice(0, n);
  const max = rows.length ? (byEur ? rows[0].eurV : rows[0].pct) : 1;
  return `<div class="rank">${rows.map((r, i) => `<button class="rank-row" data-goto="${r.c.n}">
      <span class="i">${i + 1}</span><span>${r.c.name}</span><span class="v"><b>${fmtMeasure(r.c, r.eurV, "gdp")}</b> <span class="eur">${eur(r.eurV)}</span></span>
      <span class="track"><span style="width:${((byEur ? r.eurV : r.pct) / max) * 100}%;background:${colourFn(r.c)}"></span></span></button>`).join("")}</div>`;
}

}

  const K = new Map(list.map(c => [c, calc(c, y)]));
  if (side === "ukr") {
    const total = list.reduce((s, c) => s + K.get(c).aid, 0);
    return head(regionName("UA", "Ukraine"), `${t("Who carries the most for Ukraine")} · ${periodText()}`) + `<div class="panel-body">
      <section class="section"><div class="totals">
        <div class="head ukr"><div class="lbl">${t("Aid received, all donors in the data")}</div><div class="num" style="color:var(--ukr)">${eur(total)}</div></div>
        <div class="head" style="background:var(--sea)"><div class="lbl">${t("Donors with data")}</div><div class="num">${list.filter(c => K.get(c).aid > 0).length}</div></div>
      </div></section>
      ${(() => {
        // the first list is always the number the map shows; the other one follows
        const shiftSec = (first) => `<section class="section"><h3>${first ? t("As on the map: ") : ""}${t("Support for Ukraine")}</h3>
          ${first ? measureTabs() : ""}
          ${rankList(list, c => K.get(c).uaBal, state.rankMeasure, () => "var(--ukr)", first ? 20 : 10, c => [K.get(c).uaLo, K.get(c).uaHi])}
          <p class="key" style="margin-top:8px">${t("What each country did for Ukraine since before the war: aid (loans as gifts), its share of EU-level aid, refugee hosting and extra purchases from Ukraine{back}. The change in payments to Russia is the map's second number and is not in this list.", { back: state.netBack ? t(", minus money flowing back") : "" })}</p></section>`;
        const costSec = (first) => `<section class="section"><h3>${first ? t("As on the map: ") : ""}${t("Cost carried")}${state.netBack ? t(", after money flowing back") : ""}</h3>
          ${first ? measureTabs() : ""}
          ${rankList(list, c => K.get(c).cost, state.rankMeasure, () => "var(--ukr)", first ? 20 : 10, c => [K.get(c).costLo, K.get(c).costHi])}
          <p class="key" style="margin-top:8px">${t("Only what the country gave up: aid (loans at grant equivalent), refugee hosting, extra energy cost, income lost on sales to Russia, tariffs dropped, minus oil discounts{back}. Buying less from Russia is not a cost in itself, so it is not in here.", { back: state.netBack ? t(" and money flowing back") : "" })}</p></section>`;
        return state.lens === "cost" ? costSec(true) + shiftSec(false) : shiftSec(true) + costSec(false);
      })()}
    </div>`;
  }
  // at pre-war prices, against the expected level (pre-war level x trend), as on the map
  const iy = yi(y), paidNow = list.reduce((s, c) => s + c.paidY[iy] / FRAC[iy] / (c.T.paid.p[iy] || 1), 0), paid21 = list.reduce((s, c) => s + c.T.paid.m * (c.T.paid.q[iy] || 1), 0);
  return head(regionName("RU", "Russia"), `${t("Who helps Russia the most")} · ${periodText()}`) + `<div class="panel-body">
    <section class="section"><div class="totals">
      <div class="head rus"><div class="lbl">${t("Paid to Russia since 2022, countries in the data")}</div><div class="num" style="color:var(--rus)">${eur(list.reduce((s, c) => s + K.get(c).paidRussia, 0))}</div></div>
      <div class="head" style="background:var(--sea)"><div class="lbl">${t("Yearly rate {y} vs before the war", { y })}</div><div class="num">${paid21 ? (paidNow >= paid21 ? "+" : "−") + Math.abs(Math.round((paidNow / paid21 - 1) * 100)) + "%" : "–"}</div></div>
    </div></section>
    <section class="section"><h3>${t("Change in payments to Russia: more paid")}</h3>
      ${measureTabs()}
      ${rankList(list, c => -K.get(c).rusBal, state.rankMeasure, () => "var(--rus)", 20, c => [-K.get(c).rusHi, -K.get(c).rusLo])}
      <p class="key" style="margin-top:8px">${t("More paid to Russia than expected without the war, at Russia's net gain, plus what sellers earned from Russia at their own net gain, the war-time price windfall and unpaid weapons. Aid to Ukraine is not in this list: it is the map's other number. Goods re-exported through trade hubs count for the country that made them, not for the hub.")}</p>
    </section>
    <section class="section"><h3>${t("Most money still reaching Russia")}</h3>
      ${rankList(list, c => K.get(c).paidRussia, state.rankMeasure, () => "var(--rus)", 10)}
    </section>
  </div>`;
}
function overviewPanel() {
  const y = Math.max(2022, state.year);
  const list = mapEntities();
  const rows = list.map(c => ({ c, k: calc(c, y) }));
  const cols = [
    ["shift", "Net shift", r => r.k.shift, "total"], ["shiftGdp", "Shift % GDP", r => r.k.shift, "gdp"],
    ["uaGdp", "Support for Ukraine, % GDP", r => r.k.uaBal, "gdp"], ["rusGdp", "Payments to Russia, change, % GDP", r => r.k.rusBal, "gdp"],
    ["cost", "Cost", r => r.k.cost, "total"], ["costGdp", "Cost % GDP", r => r.k.cost, "gdp"], ["costPp", "Cost / person", r => r.k.cost, "pp"],
    ["back", "Flowing back", r => r.k.flowback, "total"], ["rus", "Paid to Russia", r => r.k.paidRussia, "total"],
  ];
  const col = cols.find(x => x[0] === state.tableSort) || cols[1];
  rows.sort((a, b) => (scaled(b.c, col[2](b), col[3]) ?? -1e9) - (scaled(a.c, col[2](a), col[3]) ?? -1e9));
  const tUkr = rows.reduce((s, r) => s + r.k.aid + r.k.refugees, 0), tRus = rows.reduce((s, r) => s + r.k.paidRussia, 0);
  const metricFns = { shift: c => calc(c, y).shift, cost: c => calc(c, y).cost, rus: c => -calc(c, y).shift,
    ua: c => calc(c, y).uaBal, rusless: c => calc(c, y).rusBal, rusmore: c => -calc(c, y).rusBal };
  const rangeFns = { shift: c => { const k = calc(c, y); return [k.shiftLo, k.shiftHi]; }, cost: c => { const k = calc(c, y); return [k.costLo, k.costHi]; }, rus: c => { const k = calc(c, y); return [-k.shiftHi, -k.shiftLo]; },
    ua: c => { const k = calc(c, y); return [k.uaLo, k.uaHi]; }, rusless: c => { const k = calc(c, y); return [k.rusLo, k.rusHi]; }, rusmore: c => { const k = calc(c, y); return [-k.rusHi, -k.rusLo]; } };
  return head(t("Top lists"), `${periodText()} · ${t("{n} countries", { n: rows.length })}`) + `<div class="panel-body">
    <section class="section"><div class="totals">
      <div class="head ukr"><div class="lbl">${t("Aid and refugee hosting for Ukraine")}</div><div class="num" style="color:var(--ukr)">${eur(tUkr)}</div></div>
      <div class="head rus"><div class="lbl">${t("Money reaching Russia")}</div><div class="num" style="color:var(--rus)">${eur(tRus)}</div></div>
    </div></section>
    <section class="section">
      <div class="tabs">${[["shift", "Net, highest"], ["rus", "Net, lowest"], ["ua", "Support for Ukraine"], ["rusless", "Less paid to Russia"], ["rusmore", "More paid to Russia"], ["cost", "Cost carried"]].map(([m, l]) => `<button data-rank-metric="${m}" aria-pressed="${state.rankMetric === m}">${t(l)}</button>`).join("")}</div>
      ${measureTabs()}
      ${rankList(list, metricFns[state.rankMetric], state.rankMeasure, () => (state.rankMetric === "rus" || state.rankMetric === "rusmore" ? "var(--rus)" : "var(--ukr)"), 20, rangeFns[state.rankMetric])}
      ${state.rankMetric === "rus" || state.rankMetric === "rusmore" ? `<p class="key">${t("Many economies at this end are poorer fuel and food importers. Fuel is fungible and sold through many traders: their figures reflect what they bought from Russia, not a policy, and depend more on the model (open a country for its method band).")}</p>` : ""}
    </section>
    <details class="more"><summary>${t("Data gaps by country")}</summary>
      <p class="key">${t("● reported · ○ estimated with a range · ✕ missing. Hover a mark for details. Scroll the table sideways for all parts.")}</p>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th scope="col">${t("Country")}</th>${(rows[0]?.c.coverage || []).map(p => `<th scope="col" style="cursor:default">${t(p.part.replace("Company taxes in Russia", "Company taxes").replace("Energy switching cost", "Energy cost").replace("Money flowing back", "Flowback"))}</th>`).join("")}</tr></thead>
      <tbody>${[...rows].sort((a, b) => (b.c.gdp || 0) - (a.c.gdp || 0)).map(r => `<tr><td><a href="#${r.c.iso3}" data-goto="${r.c.n}">${r.c.name}</a></td>${(rows[0]?.c.coverage || []).map(h => { const p = (r.c.coverage || []).find(x => x.part === h.part); return p ? `<td class="cov-${p.status}" lang="en" title="${tData(p.note).s.replace(/"/g, "&quot;")}">${{ ok: "●", est: "○", missing: "✕" }[p.status]}</td>` : "<td>–</td>"; }).join("")}</tr>`).join("")}</tbody></table></div>
    </details>
    <details class="more"><summary>${t("All countries (table)")}</summary>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th scope="col">${t("Country")}</th>${cols.map(([k, l]) => `<th scope="col" aria-sort="${state.tableSort === k ? "descending" : "none"}"><button data-sort="${k}">${t(l)}${state.tableSort === k ? " ▾" : ""}</button></th>`).join("")}</tr></thead>
      <tbody>${rows.map(r => `<tr><td><a href="#${r.c.iso3}" data-goto="${r.c.n}">${r.c.name}</a></td>${cols.map(([, , f, m]) => `<td>${fmtMeasure(r.c, f(r), m, m !== "pp" && f === cols[0][2], false)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
    </details>
  </div>`;
}

function select(id, zoomTo, how) {
  if (id === "804") return openPanel("ukraine", null, how);
  if (id === "643") return openPanel("russia", null, how);
  openPanel("country", id, how);
  hideHint();
  if (!zoomTo) return;
  const c = DATA[id];
  let pts;
  {
    const f = features.find(x => x.id === id);
    if (!f) return;
    const [[x0, y0], [x1, y1]] = ANCHOR[id] ? [[projection(ANCHOR[id])[0] - 50, projection(ANCHOR[id])[1] - 35], [projection(ANCHOR[id])[0] + 50, projection(ANCHOR[id])[1] + 35]] : path.bounds(f);
    pts = [[x0, y0], [x1, y1]];
  }
  pts.push(projection(KYIV), projection(MOSCOW));
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const [x0, x1, y0, y1] = [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys)];
  const vw = W - (narrow() ? 0 : 420), vh = H - (narrow() ? H * 0.62 : 0);
  const k = Math.max(1, Math.min(8, 0.8 / Math.max((x1 - x0) / vw, (y1 - y0) / vh)));
  svg.transition().duration(reduceMotion ? 0 : 750).call(zoom.transform, d3.zoomIdentity.translate(vw / 2, vh / 2).scale(k).translate(-(x0 + x1) / 2, -(y0 + y1) / 2));
}

let hintHidden = false;
function hideHint() { if (hintHidden) return; hintHidden = true; const h = document.getElementById("hint"); h.style.opacity = 0; setTimeout(() => (h.hidden = true), 400); }

// ===== Controls =====
function setPressed(sel, attr, val) { document.querySelectorAll(sel).forEach(b => b.setAttribute("aria-pressed", String(b.dataset[attr] === val))); }
const LENS_RANK = { change: "shift", cost: "cost", ukr: "shift", rus: "rus" };
document.querySelectorAll("[data-lens]").forEach(b => (b.onclick = () => { state.lens = b.dataset.lens; state.rankMetric = LENS_RANK[state.lens]; setPressed("[data-lens]", "lens", state.lens); if (!playTimer) playBtn.setAttribute("aria-label", playLabel()); paint(); writeHash(false); }));
document.querySelectorAll("[data-measure]").forEach(b => (b.onclick = () => { state.measure = b.dataset.measure; setPressed("[data-measure]", "measure", state.measure); paint(); writeHash(false); }));
const yearInput = document.getElementById("year");
const yearText = y => (y === 2026 && FRAC[5] < 1 ? t("2026 YTD") : String(y));
// the slider reads out the period, not just the number: "2021 (before the war)", "2026 YTD"
function showYear(y) {
  document.getElementById("year-out").textContent = yearText(y);
  yearInput.setAttribute("aria-valuetext", y === 2021 ? t("2021 (before the war)") : yearText(y));
}
function setYear(y) { state.year = y; yearInput.value = y; showYear(y); paint(); }
yearInput.oninput = () => { stopPlay(); setYear(+yearInput.value); writeHash(false); };
// the buttons on top as the address gives them (a shared link); anything not given goes back to the start
function setFilters(h) {
  const lens = LENS_RANK[h.lens] ? h.lens : START.lens, measure = ["gdp", "pp", "total"].includes(h.m) ? h.m : START.measure;
  const y = +h.y >= +yearInput.min && +h.y <= +yearInput.max ? +h.y : START.year;
  if (lens === state.lens && measure === state.measure && y === state.year) return;
  state.lens = lens; state.rankMetric = LENS_RANK[lens]; state.measure = measure;
  setPressed("[data-lens]", "lens", lens); setPressed("[data-measure]", "measure", measure);
  if (!playTimer) playBtn.setAttribute("aria-label", playLabel());
  setYear(y);
}
let playTimer = null;
const playBtn = document.getElementById("play");
// change and cost are zero in 2021 by definition (it is the comparison year), so playing them starts at 2022
const playFrom = () => (state.lens === "change" || state.lens === "cost" ? 2022 : 2021);
const playLabel = () => t(playFrom() === 2022 ? "Play 2022 to 2026" : "Play 2021 to 2026");
function stopPlay() { clearInterval(playTimer); playTimer = null; playBtn.textContent = "▶"; playBtn.setAttribute("aria-label", playLabel()); writeHash(false); }
playBtn.onclick = () => {
  if (playTimer) return stopPlay();
  playBtn.textContent = "❚❚"; playBtn.setAttribute("aria-label", t("Pause"));
  setYear(playFrom());
  playTimer = setInterval(() => { if (state.year >= 2026) return stopPlay(); setYear(state.year + 1); }, 1800);
};
document.getElementById("theme").onclick = () => {
  const next = document.documentElement.dataset.theme === "light" ? "dark" : "light";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("ftm-theme", next); } catch (e) { /* not stored: the choice lasts this visit */ }
};
document.addEventListener("click", e => { const l = document.getElementById("layers"); if (l.open && !l.contains(e.target)) l.open = false; });
document.getElementById("show-flows").onchange = e => { state.flows = e.target.checked; paint(); drawFlows(0); };
document.getElementById("show-chpl").onchange = e => { state.chpl = e.target.checked; drawChpl(); paint(); };
document.getElementById("show-remit").onchange = e => { state.remit = e.target.checked; drawRemit(); paint(); };
document.getElementById("net-back").onchange = e => { state.netBack = e.target.checked; paint(); };
document.getElementById("open-rank").onclick = () => { state.rankMetric = LENS_RANK[state.lens]; closeMenu(); openPanel("overview"); };
const bar = document.getElementById("bar"), menuBtn = document.getElementById("menu-btn");
function closeMenu() { bar.dataset.menu = "closed"; menuBtn.setAttribute("aria-expanded", "false"); menuBtn.textContent = t("Options"); }
// the open menu lies over the map (see the CSS), so the map keeps its size
menuBtn.onclick = () => { const open = bar.dataset.menu !== "open"; bar.dataset.menu = open ? "open" : "closed"; menuBtn.setAttribute("aria-expanded", String(open)); menuBtn.textContent = t(open ? "Close" : "Options"); };
const search = document.getElementById("search"), searchMsg = document.getElementById("search-msg");
search.addEventListener("input", () => (searchMsg.textContent = ""));
search.addEventListener("change", () => {
  const q = search.value.trim().toLowerCase();
  const all = Object.values(DATA);
  // the name in the chosen language and the English one both work
  const names = x => [x.name, x.name_en].map(s => s.toLowerCase());
  const c = all.find(x => names(x).includes(q) || x.iso3.toLowerCase() === q) || all.find(x => names(x).some(s => s.startsWith(q)));
  const is = (iso2, en) => q === en.toLowerCase() || q === regionName(iso2, en).toLowerCase();
  if (is("UA", "ukraine")) select("804"); else if (is("RU", "russia")) select("643");
  else if (c) { searchMsg.textContent = ""; closeMenu(); select(c.n, true); }
  // no match: say so, and leave the focus in the box to try again
  else if (q) { searchMsg.textContent = t("No country found"); if (document.activeElement !== search) search.focus(); }
});
document.getElementById("zin").onclick = () => svg.transition().duration(300).call(zoom.scaleBy, 1.6);
document.getElementById("zout").onclick = () => svg.transition().duration(300).call(zoom.scaleBy, 1 / 1.6);
document.getElementById("zreset").onclick = () => svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity);
// Escape closes the Options menu first (focus back on its button), then the panel
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (bar.dataset.menu === "open" && menuBtn.offsetParent) { closeMenu(); menuBtn.focus(); }
  else if (state.panel) closePanel();
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => countryPaths && paint());
new MutationObserver(() => countryPaths && paint()).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
window.addEventListener("resize", () => { layout(); if (reduceMotion) drawFlows(0); });

// ===== Language =====
// Country names come from the browser in the chosen language (Intl.DisplayNames); English keeps the names in data.json.
// Everything else is re-rendered by paint(); this sets the parts that are rendered only once.
let STATUS_HTML = "", DATA_TO = null;
const fmtDate = d => d.toLocaleDateString(LANG === "en" ? "en-GB" : LANG, { day: "numeric", month: "long", year: "numeric" });
const featureName = f => (DATA[f.id] ? DATA[f.id].name : regionName(NUM_ISO2[f.id], f.properties.name));
function statusHtml() {
  // the banner text comes from data.json and stays English, except its first sentence (the dates), rebuilt here
  const m = STATUS_HTML.match(/^<b>Research preview<\/b> · figures to ([^,]+), updated ([^.]+)\.\s*/);
  if (LANG === "en" || !m || isNaN(new Date(m[1])) || isNaN(new Date(m[2]))) return STATUS_HTML;
  return t("<b>Research preview</b> · figures to {to}, updated {updated}.", { to: fmtDate(new Date(m[1])), updated: fmtDate(new Date(m[2])) }) + " " + dataText(STATUS_HTML.slice(m[0].length).trim());
}
function applyLang() {
  menuBtn.textContent = t(bar.dataset.menu === "open" ? "Close" : "Options");
  playBtn.setAttribute("aria-label", playTimer ? t("Pause") : playLabel());
  svg.attr("aria-label", t("World map coloured by the change in money flows since before the war") + ". " + t("With a keyboard, use “Find your country” or the Ranking view."));
  if (!countryPaths) return;
  for (const c of Object.values(DATA)) c.name = regionName(ISO2[c.iso3], c.name_en);
  if (DATA_TO) document.body.dataset.dataTo = fmtDate(DATA_TO);
  status.innerHTML = statusHtml();
  syncStatus();
  const names = Object.values(DATA).map(c => c.name);
  document.getElementById("country-list").innerHTML = [regionName("UA", "Ukraine"), regionName("RU", "Russia"), ...(LANG === "en" ? names.sort() : names.sort((a, b) => a.localeCompare(b, LANG)))].map(n => `<option value="${n}"></option>`).join("");
  lg.selectAll("text.target-label").text(f => (f.id === "804" ? regionName("UA", "Ukraine") : regionName("RU", "Russia")));
  showYear(state.year);
  paint();
}
window.onLangChange = applyLang;

// ===== Status banner =====
// The banner is one line that opens on click, tap or Enter (round 9: on computers too). While closed it is a button (its links, cut off in the line,
// are inert); open, it is plain text again so its links work.
const status = document.getElementById("status");
function syncStatus() {
  const phone = true, open = status.dataset.open === "true";
  status.tabIndex = phone ? 0 : -1;
  if (!phone) status.removeAttribute("tabindex");
  if (phone && !open) { status.setAttribute("role", "button"); status.setAttribute("aria-expanded", "false"); }
  else { status.setAttribute("role", "note"); status.removeAttribute("aria-expanded"); }
  status.querySelectorAll("a").forEach(a => (a.inert = phone && !open));
}
function toggleStatus() { status.dataset.open = status.dataset.open === "true" ? "false" : "true"; syncStatus(); }
status.addEventListener("click", e => { if (!e.target.closest("a")) toggleStatus(); });
status.addEventListener("keydown", e => { if (e.target === status && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); toggleStatus(); } });
window.addEventListener("resize", syncStatus);

// ===== Load =====
// the chosen language's dictionary (i18n.js) loads alongside the data, so the first render is already translated
// phones get simplified country shapes (all countries kept, a quarter of the size)
Promise.all([fetch(narrow() || matchMedia("(pointer: coarse)").matches ? "countries-lite.json" : "countries-50m.json").then(r => r.json()), fetch("data.json").then(r => r.json()), I18N_READY]).then(([world, data]) => {
  YEARS = data.years; FRAC = data.frac; SRC = data.sources || {}; META = data.meta || {};
  if (data.data_to) DATA_TO = new Date(data.data_to);
  for (const c of Object.values(data.countries)) { normalise(c); c.name_en = c.name; DATA[c.n] = c; byIso[c.iso3] = c; }
  INCLUDED = data.included_in || {};
  STATUS_HTML = data.status_html || "";
  features = topojson.feature(world, world.objects.countries).features.filter(f => f.id !== "010");
  layout();
  countryPaths = g.selectAll("path.country").data(features).join("path")
    .attr("class", f => "country" + (f.id === "804" ? " target-ukr" : f.id === "643" ? " target-rus" : ""))
    .attr("d", path)
    .on("pointermove", (e, f) => showTip(e, f.id === "804" ? `<b>${regionName("UA", "Ukraine")}</b>${t("Click for who carries the most")}` : f.id === "643" ? `<b>${regionName("RU", "Russia")}</b>${t("Click for who helps Russia the most")}` : (INCLUDED[f.id] && DATA[INCLUDED[f.id]] ? `<b>${featureName(f)}</b>${t("Counted in {name}'s figures", { name: DATA[INCLUDED[f.id]].name })}` : tipHtml(DATA[f.id], featureName(f)))))
    .on("pointerleave", () => (tip.hidden = true))
    .on("click", (e, f) => { select(INCLUDED[f.id] || f.id, false); });
  g.selectAll(".target-ukr, .target-rus").style("cursor", "pointer");
  lg.selectAll("text.target-label").data(features.filter(f => f.id === "804" || f.id === "643")).join("text").attr("class", "target-label").attr("text-anchor", "middle")
    .attr("x", f => labelPos(f)[0]).attr("y", f => labelPos(f)[1] + 4);
  applyLang();
  // the view in the address is known before views.js shows it, so opening a panel keeps it in the address
  const start = parseHash();
  if (VIEWS.includes(start.view) && !state.view) state.view = start.view;
  route("load");
  tidyHash();
  if (!state.panel) { const [cx, cy] = projection(narrow() ? [20, 46] : [40, 42]); svg.call(zoom.transform, d3.zoomIdentity.translate(W / 2, H / 2).scale(narrow() ? 8 : 1.6).translate(-cx, -cy)); }
  startLoop();
  if (reduceMotion) drawFlows(0);
  // data-coverage notes come separately, after the map is up
  fetch("detail.json").then(r => r.json()).then(d => {
    for (const [iso3, cov] of Object.entries(d.coverage || {})) if (byIso[iso3]) byIso[iso3].coverage = cov;
    // round 14 (H4): the method band's rebuilt alternatives
    for (const [iso3, a] of Object.entries(d.alts || {})) if (byIso[iso3]) byIso[iso3].alts = a;
    if (state.panel) renderPanel();
  }).catch(() => {});
}).catch(err => {
  // in the banner too: phones hide the hint
  const msg = t("The data could not load: {msg}", { msg: err.message });
  document.getElementById("hint").textContent = msg;
  status.textContent = msg; status.dataset.open = "true";
});
</script>
