name: Deploy map to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # round 29 (audit 29): the site is deployed only if the rebuild matches the committed data and every check passes
  checks:
    uses: ./.github/workflows/checks.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # preview images, and (round 54) the static pages written from the map: a page per country (country/<slug>/,
      # the old c/<iso>.html sent there), the ranking, the lens and method pages, the map in each language (/de/ ...),
      # robots.txt and sitemap.xml, with the address from pipeline/site_config.json (pipeline/seo_pages.mjs)
      - name: Share cards and static pages
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
          node pipeline/share_cards.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
